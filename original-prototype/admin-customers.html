<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOA Admin — Customers</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div id="app"></div>

<template id="view">
<div style="font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: #2A2627; background: #FFF8F4; font-size: 14px; line-height: 1.5; min-height: 100vh; display: flex; flex-wrap: wrap">

<aside style="flex: 1 1 232px; max-width: 100%; background: #2A2627; border-right: 1px solid #2A2627; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<img src="images/logo-light.png" alt="JOA Spa &amp; Salon" style="height: 52px; width: auto; align-self: flex-start">
<nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 2px; font-weight: 600">
<a href="admin-dashboard.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Dashboard</a>
<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">FRONT DESK</p>
<a href="admin-bookings.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Bookings<span style="font-size: 11px; background: #D6246E; color: #FFFFFF; border-radius: 999px; padding: 1px 8px">3</span></a>
<a href="admin-calendar.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Calendar</a>
<a href="admin-customers.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; background: #D6246E; color: #FFFFFF; text-decoration: none; box-shadow: 0 10px 22px -10px rgba(214,36,110,0.65)">Customers</a>
<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">SALES &amp; EXPENSES</p>
<a href="admin-pos.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Sales tracking</a>
<a href="admin-expenses.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Expenses</a>
<a href="admin-promos.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Promos</a>
<a href="admin-reports.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Reports</a>
<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">SETUP</p>
<a href="admin-services.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Services &amp; prices</a>
<a href="admin-branches.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Branches &amp; hours</a>
<a href="admin-staff.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Staff &amp; schedules</a>
<a href="admin-settings.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Settings</a>
</nav>
<a href="index.html" style="margin-top: auto; display: flex; align-items: center; min-height: 42px; padding: 0 14px; font-weight: 600; color: #C8A96E">View website ↗</a>
</aside>

<main style="flex: 999 1 640px; min-width: 0; padding: 24px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center">
<div>
<p style="margin: 0; font-size: 13px; color: #665859">Everyone who has booked or paid at JOA <span style="margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 6px; background: #F1E8EA">SAMPLE DATA</span></p>
<h1 style="margin: 2px 0 0; font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700">Customers</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><button type="button" style="min-height: 42px; padding: 0 18px; border-radius: 10px; border: 1.5px solid #D6246E; background: #FFFDFB; color: #D6246E; font-family: inherit; font-weight: 600; cursor: pointer">Export CSV</button><button type="button" style="min-height: 42px; padding: 0 18px; border-radius: 10px; border: 0; background: #D6246E; color: #FFFFFF; font-family: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 10px 22px -10px rgba(214,36,110,0.65)">+ Add customer</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px">
<div style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 18px 20px"><p style="margin: 0; font-size: 12px; font-weight: 600; color: #665859">Customers</p><p style="margin: 4px 0 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">1,284</p><p style="margin: 0; font-size: 12px; color: #665859">Across 4 branches</p></div>
<div style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 18px 20px"><p style="margin: 0; font-size: 12px; font-weight: 600; color: #665859">New this month</p><p style="margin: 4px 0 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">96</p><p style="margin: 0; font-size: 12px; color: #665859">68 from online booking</p></div>
<div style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 18px 20px"><p style="margin: 0; font-size: 12px; font-weight: 600; color: #665859">Came back within 60 days</p><p style="margin: 4px 0 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">58%</p><p style="margin: 0; font-size: 12px; color: #665859">Of first-time clients</p></div>
<div style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 18px 20px"><p style="margin: 0; font-size: 12px; font-weight: 600; color: #665859">Average spend per visit</p><p style="margin: 4px 0 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">₱812</p><p style="margin: 0; font-size: 12px; color: #665859">At promo prices</p></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section style="flex: 999 1 560px; min-width: 0; background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); overflow: hidden">
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #EFE1E4">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">Search<input type="search" placeholder="Name or mobile number" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627; width: 240px"></label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">Branch <select style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"><option>All branches</option><option>Malaybalay — Poblacion</option><option>Malaybalay — Purok 4B</option><option>Valencia City</option><option>Maramag</option></select></label>
</div>
<div style="overflow-x: auto"><div style="min-width: 700px">
<div style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) 70px 110px 100px minmax(0, 1fr); gap: 10px; padding: 11px 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #665859; background: #FFF5F7"><span>CLIENT</span><span>HOME BRANCH</span><span>VISITS</span><span>LAST VISIT</span><span style="text-align: right">TOTAL SPENT</span><span>TAGS</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<button type="button" onClick="{{r.pick}}" style="width: 100%; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) 70px 110px 100px minmax(0, 1fr); gap: 10px; padding: 11px 20px; align-items: center; border: 0; border-top: 1px solid #F8EDF0; background: {{r.bg}}; font-family: inherit; font-size: 14px; color: #2A2627; text-align: left; cursor: pointer">
<span><strong>{{r.name}}</strong><span style="display: block; font-size: 12px; color: #665859">{{r.phone}}</span></span>
<span style="color: #665859">{{r.branch}}</span>
<span>{{r.visits}}</span>
<span style="color: #665859">{{r.last}}</span>
<strong style="text-align: right">{{r.spent}}</strong>
<span style="font-size: 12px; font-weight: 600; color: #A8174F">{{r.tags}}</span>
</button>
</sc-for>
</div></div>
</section>
<aside aria-label="Customer profile" style="flex: 1 1 320px; background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); overflow: hidden">
<div style="background: #2A2627; color: #FFFFFF; padding: 20px 22px; display: flex; gap: 14px; align-items: center">
<div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 999px; background: #D6246E; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">{{c.initials}}</div>
<div><p style="margin: 0; font-size: 18px; font-weight: 700">{{c.name}}</p><p style="margin: 0; font-size: 13px; color: #E9E1DA">{{c.phone}} · {{c.branch}}</p></div>
</div>
<div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; text-align: center">
<div style="padding: 10px; border-radius: 12px; background: #FFF4F6"><div style="font-weight: 700; font-size: 18px">{{c.visits}}</div><div style="font-size: 11px; color: #665859">Visits</div></div>
<div style="padding: 10px; border-radius: 12px; background: #FFF4F6"><div style="font-weight: 700; font-size: 18px">{{c.spent}}</div><div style="font-size: 11px; color: #665859">Spent</div></div>
<div style="padding: 10px; border-radius: 12px; background: #FFF4F6"><div style="font-weight: 700; font-size: 18px">{{c.saved}}</div><div style="font-size: 11px; color: #665859">Promo savings</div></div>
</div>
<div><h2 style="margin: 0 0 6px; font-size: 13px">Notes</h2><p style="margin: 0; font-size: 14px; color: #4A3F40">{{c.note}}</p></div>
<div><h2 style="margin: 0 0 6px; font-size: 13px">Visit history</h2>
<sc-for list="{{c.history}}" as="v" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #F8EDF0; font-size: 13px"><span><strong>{{v.date}}</strong> · {{v.service}}</span><span>{{v.amt}}</span></div></sc-for>
</div>
<div style="display: flex; gap: 8px"><a href="admin-bookings.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #D6246E; color: #FFFFFF; font-weight: 600; text-decoration: none; box-shadow: 0 10px 22px -10px rgba(214,36,110,0.65)">Book again</a><button type="button" style="flex: 1; min-height: 44px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-weight: 600; cursor: pointer">Edit</button></div>
</div>
</aside>
</div>
</main>
</div>
</template>

<script src="js/joa.js"></script>
<script>
class Component extends JOA.Component {
constructor(p) { super(p); this.state = { sel: 0 }; }
renderVals() {
  const C = [
    ['Rhea M.','0918 ··· 4471','Malaybalay Pob.',9,'Today',14650,9800,'VIP · Promo','Prefers Ana. Long, thick hair — book 4-hour slot for treatments.',[['19 Oct','Protein Straight Bond — Long','₱3,999'],['14 Sep','Hair Cut / Blowdry / Iron','₱199'],['02 Aug','Balayage / Brazilian','₱2,499']]],
    ['Nica F.','0916 ··· 3058','Malaybalay Pob.',4,'Today',3196,2400,'Promo','Likes a quiet chair near the window.',[['19 Oct','Organic Hair Color','₱999'],['30 Aug','Bb Glow Glass Skin Facial','₱749']]],
    ['Kristine D.','0927 ··· 5390','Valencia City',6,'Today',4994,3800,'Lash regular','Natural lash set, refill every 3 weeks.',[['19 Oct','Classic Lash — Natural','₱499'],['28 Sep','Classic Lash — Natural','₱499']]],
    ['Joy P.','0917 ··· 2231','Maramag',2,'Today',1498,1500,'New','First booked online in September.',[['19 Oct','Korean Signature Facial','₱749'],['21 Sep','Korean Signature Facial','₱749']]],
    ['Jessa L.','0935 ··· 6620','Purok 4B',11,'Today',6340,3900,'VIP','Gel colors: nudes and pinks.',[['19 Oct','Gel Manicure, Simple Design ×2','₱899'],['05 Oct','Gel Pedicure','₱549']]],
    ['Carlo B.','0995 ··· 7713','Purok 4B',7,'Today',1393,1400,'','Short fade, every 3–4 weeks.',[['19 Oct','Hair Cut / Blowdry / Iron','₱199'],['22 Sep','Hair Cut / Blowdry / Iron','₱199']]],
    ['Angel T.','0926 ··· 8810','Valencia City',1,'Booked 19 Oct',0,0,'New','Booked Microshading online — awaiting confirmation.',[['19 Oct','Microshading (pending)','₱999']]],
    ['Mika S.','0939 ··· 6624','Purok 4B',3,'18 Oct',1098,1100,'1 no-show','Missed Gel Pedicure on 18 Oct.',[['18 Oct','Gel Pedicure (no-show)','₱0'],['20 Sep','Gel Manicure','₱499']]],
    ['Dianne C.','0920 ··· 1187','Maramag',5,'12 Oct',5245,4600,'Promo','Hydrating facial every month.',[['12 Oct','Hydrating Glow Facial','₱1,249'],['13 Sep','Hydrating Glow Facial','₱1,249']]]
  ];
  const peso = (n) => '₱' + n.toLocaleString('en-US');
  const rows = C.map((c, i) => ({ name: c[0], phone: c[1], branch: c[2], visits: c[3], last: c[4], spent: peso(c[5]), tags: c[7], bg: i === this.state.sel ? '#FDE7EE' : '#FFFDFB', pick: () => this.setState({ sel: i }) }));
  const s = C[this.state.sel];
  const c = { name: s[0], phone: s[1], branch: s[2], visits: s[3], spent: peso(s[5]), saved: peso(s[6]), note: s[8], initials: s[0].split(' ').map((w) => w[0]).join(''), history: s[9].map((h) => ({ date: h[0], service: h[1], amt: h[2] })) };
  return { rows, c };
}
}

JOA.mount(Component);
</script>
</body>
</html>
