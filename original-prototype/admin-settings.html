<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOA Admin — Settings</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div id="app"></div>

<template id="view">
<div style="font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: #2A2627; background: #FFF8F4; font-size: 14px; line-height: 1.5; min-height: 100vh; display: flex; flex-wrap: wrap">

<aside style="flex: 1 1 232px; max-width: 100%; background: #2A2627; border-right: 1px solid #2A2627; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<img src="images/logo-light.png" alt="JOA Spa &amp; Salon" style="height: 52px; width: auto; align-self: flex-start">
<nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 2px; font-weight: 600">
<a href="admin-dashboard.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Dashboard</a>
<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">FRONT DESK</p>
<a href="admin-bookings.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Bookings<span style="font-size: 11px; background: #D6246E; color: #FFFFFF; border-radius: 999px; padding: 1px 8px">3</span></a>
<a href="admin-calendar.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Calendar</a>
<a href="admin-customers.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Customers</a>
<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">SALES &amp; EXPENSES</p>
<a href="admin-pos.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Sales tracking</a>
<a href="admin-expenses.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Expenses</a>
<a href="admin-promos.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Promos</a>
<a href="admin-reports.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Reports</a>
<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">SETUP</p>
<a href="admin-services.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Services &amp; prices</a>
<a href="admin-branches.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Branches &amp; hours</a>
<a href="admin-staff.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Staff &amp; schedules</a>
<a href="admin-settings.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; background: #D6246E; color: #FFFFFF; text-decoration: none; box-shadow: 0 10px 22px -10px rgba(214,36,110,0.65)">Settings</a>
</nav>
<a href="index.html" style="margin-top: auto; display: flex; align-items: center; min-height: 42px; padding: 0 14px; font-weight: 600; color: #C8A96E">View website ↗</a>
</aside>

<main style="flex: 999 1 640px; min-width: 0; padding: 24px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center">
<div>
<p style="margin: 0; font-size: 13px; color: #665859">Business-wide preferences <span style="margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 6px; background: #F1E8EA">SAMPLE DATA</span></p>
<h1 style="margin: 2px 0 0; font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700">Settings</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><button type="button" style="min-height: 42px; padding: 0 18px; border-radius: 10px; border: 0; background: #D6246E; color: #FFFFFF; font-family: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 10px 22px -10px rgba(214,36,110,0.65)">Save changes</button></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; align-items: start">
<section style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 20px 22px; display: flex; flex-direction: column; gap: 16px"><div><h2 style="margin: 0; font-size: 16px">Business profile</h2><p style="margin: 2px 0 0; font-size: 13px; color: #665859">Shown on the website, receipts and booking pages.</p></div>
<div style="display: flex; gap: 16px; align-items: center"><div style="padding: 10px 14px; border-radius: 12px; background: #FFF4F6; border: 1px solid #EFE1E4"><img src="images/logo.png" alt="Current JOA logo" style="height: 54px; width: auto; display: block"></div><button type="button" style="min-height: 42px; padding: 0 18px; border-radius: 10px; border: 1.5px solid #D6246E; background: #FFFDFB; color: #D6246E; font-family: inherit; font-weight: 600; cursor: pointer; min-height: 38px">Replace logo</button></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Business name<input type="text" value="JOA Spa &amp; Salon" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Tagline<input type="text" value="Your beauty, our priority" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"></label></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Facebook page<input type="url" value="https://www.facebook.com/profile.php?id=61554751762826" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"></label>
</section>
<section style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 20px 22px; display: flex; flex-direction: column; gap: 16px"><div><h2 style="margin: 0; font-size: 16px">Online booking rules</h2><p style="margin: 2px 0 0; font-size: 13px; color: #665859">How clients book on the website.</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Slot length<select style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"><option>30 minutes</option><option>15 minutes</option><option>60 minutes</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Earliest booking<select style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"><option>2 hours from now</option><option>Same day</option><option>Next day</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Book up to<select style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"><option>30 days ahead</option><option>14 days ahead</option><option>60 days ahead</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Free reschedule until<select style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"><option>[X] hours before</option><option>24 hours before</option><option>12 hours before</option></select></label>
</div>
<label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" style="accent-color: #D6246E; width: 18px; height: 18px">Auto-confirm bookings when a qualified staff member is free</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" checked="" style="accent-color: #D6246E; width: 18px; height: 18px">Require a doctor slot for aesthetic, filler and PRP services</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" style="accent-color: #D6246E; width: 18px; height: 18px">Ask for a downpayment on services over ₱3,000</label>
</section>
<section style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 20px 22px; display: flex; flex-direction: column; gap: 16px"><div><h2 style="margin: 0; font-size: 16px">Payments &amp; receipts</h2></div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-wrap: wrap; gap: 6px 20px"><legend style="font-size: 12px; font-weight: 700; margin-bottom: 6px">Accepted at the register</legend>
<label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" checked="" style="accent-color: #D6246E; width: 18px; height: 18px">Cash</label><label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" checked="" style="accent-color: #D6246E; width: 18px; height: 18px">GCash</label><label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" checked="" style="accent-color: #D6246E; width: 18px; height: 18px">Maya</label><label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" checked="" style="accent-color: #D6246E; width: 18px; height: 18px">Card</label></fieldset>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Receipt number prefix<input type="text" value="JOA-[BRANCH]-" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Price rounding<select style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"><option>Round down to ₱…9</option><option>No rounding</option></select></label></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Receipt footer<input type="text" value="Because you deserve to feel beautiful." style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"></label>
</section>
<section style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 20px 22px; display: flex; flex-direction: column; gap: 16px"><div><h2 style="margin: 0; font-size: 16px">Notifications</h2></div>
<label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" checked="" style="accent-color: #D6246E; width: 18px; height: 18px">Email the branch when a new online booking arrives</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" checked="" style="accent-color: #D6246E; width: 18px; height: 18px">Email clients their booking confirmation</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 36px; font-size: 14px"><input type="checkbox" checked="" style="accent-color: #D6246E; width: 18px; height: 18px">Daily sales summary to the owner at closing</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700">Owner email<input type="email" placeholder="owner@example.com" style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px; color: #2A2627"></label>
</section>
<section style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18); padding: 20px 22px; display: flex; flex-direction: column; gap: 16px"><div><h2 style="margin: 0; font-size: 16px">Users &amp; roles</h2><p style="margin: 2px 0 0; font-size: 13px; color: #665859">Who can see and change what.</p></div>
<div style="display: flex; flex-direction: column"><div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F8EDF0; font-size: 14px"><span><strong>Owner</strong><span style="display: block; font-size: 12px; color: #665859">Everything, including reports and settings</span></span><span style="color: #665859">1 user</span></div><div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F8EDF0; font-size: 14px"><span><strong>Branch manager</strong><span style="display: block; font-size: 12px; color: #665859">Bookings, sales, staff shifts for one branch</span></span><span style="color: #665859">4 users</span></div><div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F8EDF0; font-size: 14px"><span><strong>Front desk</strong><span style="display: block; font-size: 12px; color: #665859">Bookings, register, customers</span></span><span style="color: #665859">6 users</span></div><div style="display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F8EDF0; font-size: 14px"><span><strong>Staff</strong><span style="display: block; font-size: 12px; color: #665859">Own schedule and appointments</span></span><span style="color: #665859">9 users</span></div></div><button type="button" style="min-height: 42px; padding: 0 18px; border-radius: 10px; border: 1.5px solid #D6246E; background: #FFFDFB; color: #D6246E; font-family: inherit; font-weight: 600; cursor: pointer; align-self: flex-start; min-height: 38px">Invite user</button>
</section>
</div>
</main>
</div>
</template>

<script src="js/joa.js"></script>
<script>
class Component extends JOA.Component {
renderVals() { return {}; }
}

JOA.mount(Component);
</script>
</body>
</html>
