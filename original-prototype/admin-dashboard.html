<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="images/logo.png">

<body>
<div id="app"></div>

<template id="view">
<div style="font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: #2A2627; background: #FFF8F4; font-size: 14px; line-height: 1.5; min-height: 100vh; display: flex; flex-wrap: wrap">

<aside style="flex: 1 1 232px; max-width: 100%; background: #2A2627; border-right: 1px solid #2A2627; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">FRONT DESK</p>
<a href="admin-bookings.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Bookings<span style="font-size: 11px; background: #D6246E; color: #FFFFFF; border-radius: 999px; padding: 1px 8px">3</span></a>
<a href="admin-calendar.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Calendar</a>
<a href="admin-customers.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Customers</a>
<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">SALES &amp; EXPENSES</p>
<a href="admin-pos.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Sales tracking</a>
<a href="admin-expenses.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Expenses</a>
<a href="admin-promos.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Promos</a>
<a href="admin-reports.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Reports</a>
<p style="margin: 14px 0 4px; padding: 0 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #B9AEAA">SETUP</p>
<a href="admin-services.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Services &amp; prices</a>
<a href="admin-branches.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Branches &amp; hours</a>
<a href="admin-staff.html" style="display: flex; align-items: center; min-height: 42px; padding: 0 14px; border-radius: 10px; color: #E9E1DA; text-decoration: none">Staff &amp; schedules</a>

<a href="index.html" style="margin-top: auto; display: flex; align-items: center; min-height: 42px; padding: 0 14px; font-weight: 600; color: #C8A96E">View website ↗</a>
</aside>

<main style="flex: 999 1 640px; min-width: 0; padding: 24px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center">
<div>
<p style="margin: 0; font-size: 13px; color: #665859">Monday, 19 October 2026 <span style="margin-left: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 6px; background: #F1E8EA">SAMPLE DATA</span></p>
<h1 style="margin: 2px 0 0; font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700">Good morning, [Admin name]</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">Branch
<select style="min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-size: 14px"><option>All branches</option><option>Malaybalay — Poblacion</option><option>Malaybalay — Purok 4B</option><option>Valencia City</option><option>Maramag</option></select></label>
<button type="button" style="min-height: 42px; padding: 0 18px; border-radius: 10px; border: 1.5px solid #D6246E; background: #FFFDFB; color: #D6246E; font-family: inherit; font-weight: 600; cursor: pointer">+ Walk-in</button>
<button type="button" style="min-height: 42px; padding: 0 18px; border-radius: 10px; border: 0; background: #D6246E; color: #FFFFFF; font-family: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 10px 22px -10px rgba(214,36,110,0.65)">+ New booking</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px">
<div style="background: #FFFDFB; border-radius: 16px; padding: 18px 20px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18)"><p style="margin: 0; font-size: 12px; font-weight: 600; color: #665859">Bookings today</p><p style="margin: 4px 0 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">18</p><p style="margin: 0; font-size: 12px; color: #665859">11 booked online · 7 walk-in / phone</p></div>
<div style="background: #FFFDFB; border-radius: 16px; padding: 18px 20px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18)"><p style="margin: 0; font-size: 12px; font-weight: 600; color: #665859">Awaiting confirmation</p><p style="margin: 4px 0 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; color: #9A5B00">3</p><p style="margin: 0; font-size: 12px; color: #665859">Oldest request 42 min ago</p></div>
<div style="background: #FFFDFB; border-radius: 16px; padding: 18px 20px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18)"><p style="margin: 0; font-size: 12px; font-weight: 600; color: #665859">Expected sales today <a href="admin-pos.html" style="font-size: 11px">Sales →</a></p><p style="margin: 4px 0 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">₱21,450</p><p style="margin: 0; font-size: 12px; color: #665859">At promo prices</p></div>
<div style="background: #FFFDFB; border-radius: 16px; padding: 18px 20px; border: 1px solid #EFE1E4; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18)"><p style="margin: 0; font-size: 12px; font-weight: 600; color: #665859">Chairs free now</p><p style="margin: 4px 0 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">5 of 14</p><p style="margin: 0; font-size: 12px; color: #665859">Across 4 branches</p></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 999 1 560px; min-width: 0; background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; overflow: hidden; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18)">
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #EFE1E4">
<h2 style="margin: 0; font-size: 16px">Today’s schedule</h2>
<div style="display: flex; gap: 6px; font-size: 12px; font-weight: 600"><span style="padding: 6px 12px; border-radius: 999px; background: #2A2627; color: #FFFFFF">All</span><span style="padding: 6px 12px; border-radius: 999px; background: #F8EDF0">Pending</span><span style="padding: 6px 12px; border-radius: 999px; background: #F8EDF0">Confirmed</span><span style="padding: 6px 12px; border-radius: 999px; background: #F8EDF0">Completed</span></div>
</div>
<div style="overflow-x: auto">
<div style="min-width: 760px">
<div style="display: grid; grid-template-columns: 70px minmax(0, 1.2fr) minmax(0, 1.8fr) minmax(0, 1.3fr) 80px 110px 90px; gap: 10px; padding: 10px 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #665859; background: #FFF5F7"><span>TIME</span><span>CLIENT</span><span>SERVICE</span><span>BRANCH</span><span>STAFF</span><span>STATUS</span><span style="text-align: right">PRICE</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<div style="display: grid; grid-template-columns: 70px minmax(0, 1.2fr) minmax(0, 1.8fr) minmax(0, 1.3fr) 80px 110px 90px; gap: 10px; padding: 12px 20px; align-items: center; border-top: 1px solid #F8EDF0">
<span style="font-weight: 700">{{r.time}}</span>
<span>{{r.client}}<span style="display: block; font-size: 11px; color: #665859">{{r.src}}</span></span>
<span>{{r.service}}</span>
<span style="color: #665859">{{r.branch}}</span>
<span>{{r.staff}}</span>
<span style="justify-self: start; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: {{r.sbg}}; color: {{r.sfg}}">{{r.status}}</span>
<span style="text-align: right; font-weight: 600">{{r.price}}</span>
</div>
</sc-for>
</div>
</div>
</section>

<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 20px">
<section style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18)">
<h2 style="margin: 0; font-size: 16px">Booking requests</h2>
<sc-for list="{{pending}}" as="p" hint-placeholder-count="3">
<div style="border: 1px solid #F0D9A9; background: #FFFAF0; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; gap: 8px"><strong>{{p.client}}</strong><span style="font-size: 12px; color: #665859">{{p.time}}</span></div>
<span style="font-size: 13px">{{p.service}} · {{p.branch}}</span>
<div style="display: flex; gap: 8px"><button type="button" style="flex: 1; min-height: 40px; border-radius: 8px; border: 0; background: #D6246E; color: #FFFFFF; font-family: inherit; font-weight: 600; cursor: pointer">Confirm</button><button type="button" style="flex: 1; min-height: 40px; border-radius: 8px; border: 1.5px solid #E6CBD5; background: #FFFDFB; font-family: inherit; font-weight: 600; cursor: pointer">Suggest time</button></div>
</div>
</sc-for>
</section>

<section style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18)">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 16px">Live promo</h2><a href="admin-promos.html" style="font-size: 13px; font-weight: 600">Manage</a></div>
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 999px; border: 2px solid #C8A96E; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 20px; color: #D6246E">50%</div>
<div><strong>50% OFF All Services</strong><p style="margin: 0; font-size: 12px; color: #665859">All 4 branches · ends [end date] · 112 bookings used it</p></div>
</div>
</section>

<section style="background: #FFFDFB; border-radius: 16px; border: 1px solid #EFE1E4; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 10px 28px -14px rgba(42,38,39,0.18)">
<h2 style="margin: 0; font-size: 16px">Bookings by branch, today</h2>
<sc-for list="{{byBranch}}" as="b" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{b.name}}</span><strong>{{b.n}}</strong></div><div style="height: 8px; border-radius: 999px; background: #F8EDF0"><div style="height: 8px; border-radius: 999px; background: #F28BB0; width: {{b.w}}"></div></div></div>
</sc-for>
</section>
</div>
</div>
</main>
</div>
</template>

<script src="js/joa.js"></script>
<script>
class Component extends JOA.Component {
  renderVals() {
    const S = { Completed: ['#F1E8EA', '#2A2627'], Confirmed: ['#E3EDF8', '#1D4F8C'], Pending: ['#FCEFD9', '#8A5100'], 'No-show': ['#FDE7EE', '#D6246E'] };
    const R = [
      ['8:00','Maria S.','Website','Hair Cut / Blowdry / Iron','Malaybalay Pob.','Ana','Completed','₱199'],
      ['8:30','Jessa L.','Walk-in','Gel Manicure','Purok 4B','Liza','Completed','₱499'],
      ['9:00','Kristine D.','Website','Classic Lash — Natural','Valencia','Mae','Confirmed','₱499'],
      ['10:00','Rhea M.','Messenger','Protein Straight Bond — Long','Malaybalay Pob.','Ana','Confirmed','₱3,999'],
      ['10:30','Joy P.','Website','Korean Signature Facial','Maramag','Grace','Pending','₱749'],
      ['11:00','Carlo B.','Phone','Hair Cut / Blowdry / Iron','Purok 4B','Jun','Confirmed','₱199'],
      ['13:00','Angel T.','Website','Microshading','Valencia','Mae','Pending','₱999'],
      ['14:00','Lovely R.','Website','Botox Alartox','Maramag','[Doctor]','Pending','₱1,999'],
      ['15:30','Nica F.','Website','Organic Hair Color','Malaybalay Pob.','Ana','Confirmed','₱999']
    ];
    const rows = R.map((r) => ({ time: r[0], client: r[1], src: r[2], service: r[3], branch: r[4], staff: r[5], status: r[6], price: r[7], sbg: S[r[6]][0], sfg: S[r[6]][1] }));
    const pending = R.filter((r) => r[6] === 'Pending').map((r) => ({ client: r[1], time: 'Today ' + r[0], service: r[3], branch: r[4] }));
    const B = [['Malaybalay — Poblacion', 6], ['Malaybalay — Purok 4B', 5], ['Valencia City', 4], ['Maramag', 3]];
    const byBranch = B.map((b) => ({ name: b[0], n: b[1], w: Math.round(b[1] / 6 * 100) + '%' }));
    return { rows, pending, byBranch };
  }
}

JOA.mount(Component);
</script>
</body>
</html>
