<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOA Spa &amp; Salon — Book an appointment</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div id="app"></div>

<template id="view">
<div style="font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: #2A2627; background: #FFF8F4; font-size: 16px; line-height: 1.55; min-height: 100vh">

<header style="background: #FFFDFB; border-bottom: 1px solid #F5D3DF; box-shadow: 0 8px 28px -14px rgba(42,38,39,0.22); position: relative; z-index: 2">
<div style="max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<a href="index.html" aria-label="JOA Spa &amp; Salon home"><img src="images/logo.png" alt="JOA Spa &amp; Salon" style="height: 56px; width: auto; display: block"></a>
<a href="index.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600">← Back to site</a>
</div>
</header>

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 96px; display: flex; flex-direction: column; gap: 28px">
<div>
<p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400; font-size: 26px; line-height: 1; color: #D6246E">Book now</p>
<h1 style="margin: 4px 0 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.1">and let us take care of you</h1>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<section style="background: #FFFDFB; border-radius: 22px; border: 1px solid #F5D3DF; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 16px 36px -16px rgba(214,36,110,0.30)">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #D6246E">1 · CHOOSE A BRANCH</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{branches}}" as="b" hint-placeholder-count="4">
<button type="button" onClick="{{b.pick}}" style="text-align: left; min-height: 76px; padding: 14px 18px; border-radius: 16px; border: 2px solid {{b.border}}; background: {{b.bg}}; font-family: inherit; color: #2A2627; cursor: pointer">
<span style="display: block; font-weight: 700; font-size: 15px">{{b.name}}</span>
<span style="display: block; font-size: 13px; color: #665859">{{b.hours}}</span>
</button>
</sc-for>
</div>
</section>

<section style="background: #FFFDFB; border-radius: 22px; border: 1px solid #F5D3DF; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 16px 36px -16px rgba(214,36,110,0.30)">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #D6246E">2 · PICK A SERVICE</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #D6246E; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{svcs}}" as="s" hint-placeholder-count="5">
<button type="button" onClick="{{s.pick}}" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; padding: 10px 18px; border-radius: 14px; border: 2px solid {{s.border}}; background: {{s.bg}}; font-family: inherit; color: #2A2627; text-align: left; cursor: pointer">
<span style="font-size: 15px; font-weight: 600">{{s.name}}</span>
<span style="display: flex; gap: 10px; align-items: baseline; flex-shrink: 0"><s style="font-size: 13px; color: #665859">{{s.reg}}</s><span style="font-size: 17px; font-weight: 700; color: #D6246E">{{s.promo}}</span></span>
</button>
</sc-for>
</div>
</section>

<section style="background: #FFFDFB; border-radius: 22px; border: 1px solid #F5D3DF; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 16px 36px -16px rgba(214,36,110,0.30)">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #D6246E">3 · DATE &amp; TIME</h2>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{dates}}" as="d" hint-placeholder-count="7">
<button type="button" onClick="{{d.pick}}" style="min-height: 72px; border-radius: 14px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em">{{d.dow}}</span>
<span style="font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 700; line-height: 1.1">{{d.day}}</span>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px">
<sc-for list="{{slots}}" as="t" hint-placeholder-count="12">
<button type="button" onClick="{{t.pick}}" disabled="{{t.disabled}}" style="min-height: 44px; border-radius: 10px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; text-decoration: {{t.deco}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; color: #665859">Crossed-out times are already booked at this branch.</p>
</section>

<section style="background: #FFFDFB; border-radius: 22px; border: 1px solid #F5D3DF; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 16px 36px -16px rgba(214,36,110,0.30)">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #D6246E">4 · YOUR DETAILS</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Full name<input type="text" placeholder="Juan dela Cruz" style="min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #E7C3D1; font-family: inherit; font-size: 15px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Mobile number<input type="tel" placeholder="09XX XXX XXXX" style="min-height: 46px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #E7C3D1; font-family: inherit; font-size: 15px"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Notes for your therapist (optional)<textarea rows="3" placeholder="Hair length, allergies, preferred staff…" style="padding: 12px 14px; border-radius: 10px; border: 1.5px solid #E7C3D1; font-family: inherit; font-size: 15px; resize: vertical"></textarea></label>
</section>
</div>

<aside style="flex: 1 1 320px; background: #FFFDFB; border-radius: 22px; border: 1px solid #F5D3DF; overflow: hidden; box-shadow: 0 1px 2px rgba(42,38,39,0.05), 0 16px 36px -16px rgba(214,36,110,0.30)">
<div style="background: #D6246E; color: #FFFFFF; padding: 20px 26px"><h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 600">Your booking</h2></div>
<dl style="margin: 0; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; font-size: 15px">
<div><dt style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #665859">BRANCH</dt><dd style="margin: 2px 0 0; font-weight: 600">{{sum.branch}}</dd></div>
<div><dt style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #665859">SERVICE</dt><dd style="margin: 2px 0 0; font-weight: 600">{{sum.service}}</dd></div>
<div><dt style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #665859">DATE &amp; TIME</dt><dd style="margin: 2px 0 0; font-weight: 600">{{sum.when}}</dd></div>
</dl>
<div style="margin: 0 26px; padding: 18px 0; border-top: 1px dashed #E7C3D1; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<div style="display: flex; justify-content: space-between"><span style="color: #665859">Regular price</span><s style="color: #665859">{{sum.reg}}</s></div>
<div style="display: flex; justify-content: space-between"><span style="color: #665859">50% OFF All Services</span><span style="color: #665859">{{sum.save}}</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px"><span style="font-weight: 700">You pay at the branch</span><span style="font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700; color: #D6246E">{{sum.promo}}</span></div>
</div>
<div style="padding: 0 26px 26px; display: flex; flex-direction: column; gap: 10px">
<button type="button" onClick="{{confirm}}" style="min-height: 54px; border-radius: 999px; border: 0; background: #D6246E; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 22px -10px rgba(214,36,110,0.65)">Confirm booking</button>
<p style="margin: 0; font-size: 12px; color: #665859; text-align: center">The branch confirms your slot shortly. Free to reschedule up to [X] hours before.</p>
</div>
</aside>
</div>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="max-width: 640px; margin: 0 auto; padding: 96px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px">
<div style="width: 96px; height: 96px; border-radius: 999px; background: #FFFDFB; border: 2px solid #C8A96E; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 30px -12px rgba(168,23,79,0.40)"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#D6246E" stroke-width="2"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
<p style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 400; font-size: 30px; line-height: 1; color: #D6246E">See you!</p>
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 36px">Booking request sent</h1>
<p style="margin: 0; color: #665859">{{sum.service}} at {{sum.branch}}, {{sum.when}}. Reference <strong style="color: #2A2627">JOA-10482</strong>. You’ll see the confirmation under My bookings.</p>
<button type="button" onClick="{{reset}}" style="min-height: 50px; padding: 0 28px; border-radius: 999px; border: 1.5px solid #D6246E; background: #FFFDFB; color: #D6246E; font-family: inherit; font-weight: 600; cursor: pointer">Book another service</button>
</div>
</sc-if>

</div>
</template>

<script src="js/joa.js"></script>
<script>
class Component extends JOA.Component {
  constructor(p) { super(p); this.state = { b: 0, c: 0, s: 0, d: 0, t: 3, done: false }; }
  renderVals() {
    const st = this.state;
    const peso = (n) => '₱' + n.toLocaleString('en-US');
    const B = [
      { name: 'Malaybalay — Poblacion', hours: 'Daily 8:00 AM – 5:00 PM', open: 8, close: 17 },
      { name: 'Malaybalay — Purok 4B', hours: 'Daily 7:30 AM – 6:30 PM', open: 7.5, close: 18.5 },
      { name: 'Valencia City', hours: 'Hours to confirm', open: 8, close: 17 },
      { name: 'Maramag', hours: 'Daily 10:00 AM – 9:00 PM', open: 10, close: 21 }
    ];
    const C = [
      ['Hair', [['Hair Cut / Blowdry / Iron',399,199],['Organic Hair Color',1999,999],['L’Oréal Rebond',3499,1749],['iCure Keratin Blowout',2499,1249],['Protein Straight Bond — Medium',6999,3499]]],
      ['Lashes & Brows', [['Classic Lash — Natural',999,499],['Human Hair — Cat Eye',2999,1499],['Lash Lift with Tint',1999,999],['Microshading',1999,999],['Microblading',3500,1750]]],
      ['Nails', [['Gel Manicure',649,499],['Gel Pedicure',699,549],['Nail Extension (Plain)',1499,749]]],
      ['Facial & Skin', [['Korean Signature Facial',1499,749],['Bb Glow Glass Skin Facial',1499,749],['Hydrating Glow Facial',2499,1249],['RF Microneedling',9999,4999]]],
      ['Aesthetics', [['Botox Alartox',3999,1999],['Korean Nose Thread Lift',15000,7500],['Dermal Filler',13999,6999]]],
      ['Spa & Wellness', [['White Glow Therapy',1499,749],['K-Beauty Glow',3999,1999]]]
    ];
    const DOW = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
    const sel = (on) => ({ border: on ? '#D6246E' : '#F5D3DF', bg: on ? '#FDE7EE' : '#FFFDFB' });
    const branches = B.map((b, i) => ({ name: b.name, hours: b.hours, ...sel(i === st.b), pick: () => this.setState({ b: i, t: -1 }) }));
    const cats = C.map((c, i) => ({ label: c[0], bg: i === st.c ? '#D6246E' : '#FFFDFB', fg: i === st.c ? '#FFFFFF' : '#D6246E', pick: () => this.setState({ c: i, s: 0 }) }));
    const list = C[st.c][1];
    const svcs = list.map((s, i) => ({ name: s[0], reg: peso(s[1]), promo: peso(s[2]), ...sel(i === st.s), pick: () => this.setState({ s: i }) }));
    const dates = DOW.map((w, i) => ({ dow: w, day: String(19 + i), border: i === st.d ? '#D6246E' : '#F5D3DF', bg: i === st.d ? '#D6246E' : '#FFFDFB', fg: i === st.d ? '#FFFFFF' : '#2A2627', pick: () => this.setState({ d: i, t: -1 }) }));
    const br = B[st.b];
    const fmt = (h) => { const hr = Math.floor(h), m = h % 1 ? '30' : '00'; const ap = hr >= 12 ? 'PM' : 'AM'; return ((hr + 11) % 12 + 1) + ':' + m + ' ' + ap; };
    const slots = [];
    for (let h = br.open, i = 0; h <= br.close - 1; h += 0.5, i++) {
      const taken = (i * 7 + st.d * 3 + st.b) % 5 === 0;
      const on = i === st.t;
      slots.push({ label: fmt(h), disabled: taken, deco: taken ? 'line-through' : 'none', border: on ? '#D6246E' : '#F5D3DF', bg: on ? '#D6246E' : (taken ? '#F8EEF1' : '#FFFDFB'), fg: on ? '#FFFFFF' : (taken ? '#A6999A' : '#2A2627'), pick: () => { if (!taken) this.setState({ t: i }); } });
    }
    const svc = list[st.s] || list[0];
    const time = st.t >= 0 && slots[st.t] ? slots[st.t].label : 'Choose a time';
    const sum = { branch: br.name, service: svc[0], when: DOW[st.d].charAt(0) + DOW[st.d].slice(1).toLowerCase() + ' ' + (19 + st.d) + ' Oct · ' + time, reg: peso(svc[1]), save: '−' + peso(svc[1] - svc[2]), promo: peso(svc[2]) };
    return { branches, cats, svcs, dates, slots, sum, notDone: !st.done, done: st.done, confirm: () => this.setState({ done: true }), reset: () => this.setState({ done: false, t: -1 }) };
  }
}

JOA.mount(Component);
</script>
</body>
</html>
